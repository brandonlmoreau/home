<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16181b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="construction-tracker/icons/icon.svg" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Brandon’s pocket</p>
      <h1>Home</h1>
      <p class="lede">Tap an app to open it on this phone.</p>
    </header>

    <section class="apps" aria-label="Apps">
      <a class="app-tile" href="construction-tracker/">
        <span class="app-icon" aria-hidden="true">
          <img src="construction-tracker/icons/icon.svg" alt="" width="56" height="56" />
        </span>
        <span class="app-copy">
          <strong>Construction Tracker</strong>
          <span>Clock in, clock out, weekly hours</span>
        </span>
        <span class="app-chev" aria-hidden="true"></span>
      </a>
    </section>
  </main>
</body>
</html>
